    - Git: DEVOPS-CORE/03-GIT/README.md
    - Networking: DEVOPS-CORE/04-NETWORKING/README.md
    - Containerization: DEVOPS-CORE/05-CONTAINERIZATION/README.md
    - CI/CD: DEVOPS-CORE/06-CICD/README.md
    - Deployment Strategies: DEVOPS-CORE/07-DEPLOYMENT-STRATEGIES/README.md
    - Infrastructure as Code: DEVOPS-CORE/08-IAC/Terraform/README.md
    - Configuration Management: DEVOPS-CORE/09-CONFIG-MANAGEMENT/Ansible/README.md
    - Message Queues: DEVOPS-CORE/10-MESSAGE-QUEUES/Apache-Kafka/apache-kafka.md
    - NGINX: DEVOPS-CORE/11-NGINX/0-NGINX-Overview.md
    - Observability: DEVOPS-CORE/12-OBSERVABILITY/README.md
    - Caching: DEVOPS-CORE/13-CACHING/README.md
    - Secrets Management: DEVOPS-CORE/14-SECRETS-MANAGEMENT/Hashicorp-Vault/README.md
    - System Design: DEVOPS-CORE/15-SYSTEM-DESIGN/README.md
